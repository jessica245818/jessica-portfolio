<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jessica George — data and machine learning portfolio.">
  <title>Jessica George</title>
  <style>
    :root { color-scheme: light; --ink:#111827; --paper:#F7F6F2; --navy:#17324D; --amber:#C58B4E; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(680px,100%); }
    .mark { width:46px; height:46px; display:grid; place-items:center; margin-bottom:2rem; border:1px solid color-mix(in srgb,var(--navy) 20%,transparent); border-radius:12px; color:var(--navy); font-weight:750; letter-spacing:-.04em; }
    h1 { margin:0 0 1rem; color:var(--navy); font-size:clamp(2.5rem,9vw,5.4rem); line-height:.95; letter-spacing:-.06em; }
    p { max-width:610px; margin:0; font-size:clamp(1.15rem,3vw,1.55rem); line-height:1.5; }
    .status { margin-top:2.25rem; color:#52606d; font-size:.9rem; letter-spacing:.08em; text-transform:uppercase; }
    .status::before { content:""; display:inline-block; width:.55rem; height:.55rem; margin-right:.65rem; border-radius:50%; background:var(--amber); vertical-align:.05rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">JG</div>
    <h1>Jessica George</h1>
    <p>I turn messy data questions into honest, usable systems that help people decide what to do next.</p>
    <div class="status">Portfolio in progress</div>
  </main>
</body>
</html>
